[project]
name = "roadrail-collector"
version = "0.1.0"
description = "RoadRail collector + analytics (Python 3.11 · asyncio · httpx · APScheduler · pandas)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx==0.28.1",
  "psycopg[binary,pool]==3.2.10",
  "redis==6.4.0",
  "APScheduler==3.11.0",
  "pandas==2.3.2",
  "numpy==2.3.3",
  "PyYAML==6.0.2",
  "pydantic-settings==2.10.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",       # 8.4.2 는 PYSEC-2026-1845 (pip-audit)
  "pytest-asyncio==1.4.0",
  "ruff==0.16.8",
  "pip-audit==2.10.1",
]

[project.scripts]
roadrail = "roadrail.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["roadrail*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: PostgreSQL · Redis 가 필요한 테스트 (DATABASE_URL · REDIS_URL)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
