# 의존성 업데이트 — 매주. 버전은 모두 고정해 둔다.
#   · minor · patch 는 생태계마다 PR 하나로 묶고 (예전: 한 번에 PR 19개), CI 필수 검사(ci passed)가 통과하면 자동 병합한다
#     (workflows/dependabot-auto-merge.yml · ADR-021)
#   · 메이저는 따로 PR — 이전 작업이 필요하므로 사람이 CI 와 함께 검토 (Next · React · Tailwind · TypeScript · pandas …).
#     actions 묶음은 메이저도 같은 PR 에 들어오므로 메이저가 섞이면 자동 병합하지 않는다
#   · 런타임에 맞춰 일부러 고정한 것은 올리지 않는다 — 런타임을 올릴 때 함께 바꾼다:
#     Python 3.11(pyproject requires-python <3.12) · Node 22 LTS(@types/node 도 같이) · JDK 21(Gradle 툴체인과 함께) · React 18(react-is 도 같이)
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: react-is
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /collector
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      collector-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      api-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/api, /collector, /web]
    schedule: { interval: weekly }
    ignore:
      # 3.11 → 3.14 는 태그상 minor — requires-python 과 함께 올린다
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
