name: codeql

# 정적 보안 분석 — PR · main push · 매주(새 쿼리로 다시 검사). 결과는 Security 탭(code scanning)에 쌓인다.
# 필수 검사(ci passed)에는 넣지 않는다 — 경보는 Security 탭에서 분류하고, 분석 실패가 Dependabot 자동 병합을 막지 않게.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 0 * * 1"   # 월요일 09:37 KST — Dependabot(06:00) 자동 병합 뒤의 main 을 분석 (그 병합은 push 분석을 띄우지 않는다)

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # 모두 빌드 없이 분석(build-mode none) — Java 도 Gradle 빌드 없이 소스에서 추출한다
        language: [java-kotlin, javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended   # 기본 쿼리 + 정밀도 · 심각도가 조금 낮은 보안 쿼리
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
