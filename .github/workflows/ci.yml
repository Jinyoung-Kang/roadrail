name: ci

on:
  push:
    branches: [main]
  pull_request:
  # 매주 월요일 09:17 KST — Dependabot(06:00) 자동 병합은 GITHUB_TOKEN 병합이라 push CI 가 돌지 않는다.
  # 그 주에 합쳐진 main 전체를 다시 검사한다 (ADR-021). 정각은 GitHub 일정 실행이 밀리기 쉬워 피한다.
  schedule:
    - cron: "17 0 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 모든 작업은 읽기 권한만 — 저장소 기본값(read)에 기대지 않고 워크플로에 명시한다 (CodeQL actions/missing-workflow-permissions)
permissions:
  contents: read

jobs:
  collector:
    name: collector (Python 3.11 · ruff · pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: roadrail, POSTGRES_PASSWORD: roadrail, POSTGRES_DB: roadrail_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roadrail" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: collector
    env:
      TEST_DATABASE_URL: postgresql://roadrail:roadrail@localhost:5432/roadrail_test
      TEST_REDIS_URL: redis://localhost:6379/15
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip, cache-dependency-path: collector/pyproject.toml }
      - run: pip install -e '.[dev]'
      - run: ruff check roadrail tests
      - name: pip-audit (선언한 의존성 · 개발 도구)
        run: |
          python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb'))['project']; print('\n'.join(d['dependencies'] + d['optional-dependencies']['dev']))" > /tmp/req.txt
          pip-audit --progress-spinner off -r /tmp/req.txt
      - run: pytest -q

  api:
    name: api (Java 21 · JUnit · Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      # GitHub 밖의 액션은 커밋 SHA 로 고정 — 태그는 옮겨질 수 있다 (Dependabot 이 SHA 와 주석을 함께 올린다)
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew --no-daemon test
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: api-test-report, path: api/build/reports/tests }

  web:
    name: web (Next.js 16 · tsc · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # 액션(gitleaks-action)은 첫 push 에서 '첫 커밋^' 범위를 만들다 git 오류로 실패한다 → 공식 이미지로 전체 이력을 직접 검사
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner

  images:
    name: docker images
    runs-on: ubuntu-latest
    needs: [collector, api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: cp .env.example .env
      - run: docker compose build

  # main 브랜치 보호의 필수 검사는 이 작업 하나 — 작업 이름의 버전 표기가 바뀌어도 보호 설정을 고치지 않는다 (ADR-021).
  # 건너뛴 작업은 필수 검사에서 '성공'으로 치므로 always() 로 늘 돌고, 앞 작업이 모두 success 인지 직접 본다(취소도 실패).
  # PR 에서만 — 보호는 PR 에만 걸리고, main push 가 동시 실행 취소로 멈춘 이전 커밋에 실패 표시를 남기지 않게.
  passed:
    name: ci passed
    if: always() && github.event_name == 'pull_request'
    needs: [collector, api, web, secrets, images]
    runs-on: ubuntu-latest
    steps:
      - name: 앞 작업이 모두 성공했는지 확인
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
