name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collector:
    name: collector (Python 3.11 · ruff · pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: roadrail, POSTGRES_PASSWORD: roadrail, POSTGRES_DB: roadrail_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roadrail" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: collector
    env:
      TEST_DATABASE_URL: postgresql://roadrail:roadrail@localhost:5432/roadrail_test
      TEST_REDIS_URL: redis://localhost:6379/15
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: collector/pyproject.toml }
      - run: pip install -e '.[dev]'
      - run: ruff check roadrail tests
      - name: pip-audit (선언한 의존성 · 개발 도구)
        run: |
          python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb'))['project']; print('\n'.join(d['dependencies'] + d['optional-dependencies']['dev']))" > /tmp/req.txt
          pip-audit --progress-spinner off -r /tmp/req.txt
      - run: pytest -q

  api:
    name: api (Java 21 · JUnit · Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon test
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: api-test-report, path: api/build/reports/tests }

  web:
    name: web (Next.js 15 · tsc · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: docker images
    runs-on: ubuntu-latest
    needs: [collector, api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: cp .env.example .env
      - run: docker compose build
